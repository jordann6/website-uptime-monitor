name: Deploy Uptime Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_DIR: infrastructure/terraform

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/

  package:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Zip Lambda
        run: |
          cd backend
          zip uptime_checker.zip uptime_checker.py
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: backend/uptime_checker.zip

  terraform:
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          path: backend/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init
      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="uptime_alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="uptime_alert_phone=${{ secrets.ALERT_PHONE }}" \
            -var="uptime_content_check=${{ vars.CONTENT_CHECK }}" \
            -out=tf.plan
      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply tf.plan
